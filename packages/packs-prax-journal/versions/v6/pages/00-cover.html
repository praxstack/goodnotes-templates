<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prax Journal v6 · 00 · Cover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,0..100;1,9..144,300..700,0..100&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════════
   PRAX JOURNAL v6 · PAGE 00 · COVER · TITLE-PAGE archetype
   Wave 15 additive (15-B). The first page of the journal.
   EXCEPTION to tier table: borrows TITLE-PAGE archetype but uses SPINE
   paper (warmer cream from 15-C) so it flows visually into page 01.
   No body. No kicker. No permission strip. No rotating header/footer.
   ═══════════════════════════════════════════════════════════════════════ */
:root {
  --page-w: 210mm; --page-h: 297mm; --margin: 22mm;
  --paper: #F6EFE2;  /* SPINE paper (15-C warmer value) — flows into page 01 */
  --bleed: rgba(126, 155, 133, 0.22);  /* SPINE bleed (sage) */
  --ink: #1f2126; --ink-soft: #3a3a40; --ink-quiet: #6E6658; --ink-whisper: #B5AD9F;
  --font-serif: 'Fraunces', 'Iowan Old Style', 'Charter', 'Georgia', serif;
  --font-sans:  'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', sans-serif;
  --font-mono:  'JetBrains Mono', 'SF Mono', 'Menlo', 'Consolas', monospace;
  --shadow-page: 0 1px 2px rgba(31,33,38,0.04), 0 16px 48px rgba(31,33,38,0.10), 0 2px 8px rgba(31,33,38,0.04);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #E4DFD2;
  font-family: var(--font-sans); font-size: 8.5pt;
  color: var(--ink-soft); line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.page {
  width: var(--page-w); height: var(--page-h);
  background: var(--paper);
  margin: 10mm auto; padding: var(--margin);
  position: relative; overflow: hidden;
  box-shadow: var(--shadow-page);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
@media print {
  body { background: #fff; }
  .page { margin: 0; box-shadow: none; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  @page { size: A4 portrait; margin: 0; }
}

/* Title block — vertically centered. No header, no body, no permission. */
.title-block {
  display: flex; flex-direction: column; align-items: center;
  text-align: center;
}
.title-block .title {
  font-family: var(--font-serif); font-style: italic;
  font-size: 64pt; font-weight: 400;
  line-height: 1.0; letter-spacing: -0.025em;
  color: var(--ink);
  font-variation-settings: "opsz" 144, "SOFT" 60;
}
.title-block .subtitle {
  margin-top: 12mm;
  font-family: var(--font-serif); font-style: italic;
  font-size: 14pt; font-weight: 400;
  color: var(--ink-soft);
  opacity: 0.55;
  font-variation-settings: "opsz" 36, "SOFT" 60;
  line-height: 1.3;
  letter-spacing: -0.005em;
}
.title-block .meta {
  margin-top: 24mm;
  font-family: var(--font-mono); font-size: 7pt;
  font-weight: 400;
  letter-spacing: 0.16em; text-transform: lowercase;
  color: var(--ink-quiet); opacity: 0.5;
}

/* Goodnotes nav-chip — bottom-right, single [next →] only. The cover IS home. */
.nav-chrome {
  position: absolute; bottom: 7mm; right: 7mm;
  display: flex; gap: 2mm;
  font-family: var(--font-mono); font-size: 5.5pt;
  letter-spacing: 0.12em; text-transform: lowercase;
  z-index: 10; opacity: 0.3;
}
.nav-chrome a {
  color: var(--ink-quiet); text-decoration: none;
  padding: 0.8mm 2mm;
  border: 0.5px solid var(--ink-whisper);
  background: rgba(249,245,236,0.65);
  border-radius: 0.8mm;
}
.nav-chrome a:hover { color: var(--ink); border-color: var(--ink-soft); opacity: 1; }

.bind-edge {
  position: absolute;
  left: 0;
  top: 0;
  height: 100%;
  width: 6mm;
  background: var(--bleed);
  pointer-events: none;
  z-index: 0;
}
</style>
</head>
<body>
<a id="page-00" class="page-anchor"></a>
<main class="page" data-template="v6-cover-title" role="document">
  <div class="bind-edge" aria-hidden="true"></div>
  <div class="title-block">
    <h1 class="title">Prax Journal</h1>
    <p class="subtitle">for the harder days</p>
    <p class="meta">v6 · 2026</p>
  </div>

  <nav class="nav-chrome" aria-label="page navigation">
    <a href="#page-22">[next &rarr;]</a>
  </nav>
</main>
</body>
</html>
