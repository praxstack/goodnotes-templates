<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prax Journal v6 · 06 · Behavioral Activation · INVENTORY-LIST</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,0..100;1,9..144,300..700,0..100&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════════
   PRAX JOURNAL v6 · PAGE 06 · BEHAVIORAL ACTIVATION (INVENTORY-LIST)
   5 domains · min-viable version today.
   2-column TABLE shape: domain label left, checkbox + 2 baselines right.
   Hairline sage rule between rows. No grid. No prose-zone. No sticker rings.
   ═══════════════════════════════════════════════════════════════════════ */
:root {
  --page-w: 210mm; --page-h: 297mm; --margin: 22mm;
  --paper: #F2F0EC;
  --rule-color:  rgba(126, 155, 133, 0.4);
  --rule-stroke: 0.5px;
  --bleed: rgba(192, 136, 102, 0.22);
  --ink: #1f2126; --ink-soft: #4A453D; --ink-quiet: #6E6658; --ink-whisper: #B5AD9F;
  --sage: #7e9b85; --sage-ink: #4E6249;
  --sage-rule: rgba(126,155,133,0.4);
  --sage-hair: rgba(126,155,133,0.25);
  --clay: #c08866; --clay-ink: #8A3E2E; --clay-edge: rgba(192,136,102,0.32);
  --font-serif: 'Fraunces', 'Iowan Old Style', 'Charter', 'Georgia', serif;
  --font-sans:  'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', sans-serif;
  --font-mono:  'JetBrains Mono', 'SF Mono', 'Menlo', 'Consolas', monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #E4DFD2; font-family: var(--font-sans); font-size: 8.5pt; color: var(--ink-soft); line-height: 1.45; -webkit-font-smoothing: antialiased; }
.page {
  width: var(--page-w); height: var(--page-h); background: var(--paper);
  margin: 10mm auto; padding: var(--margin);
  position: relative; overflow: hidden;
  box-shadow: 0 1px 2px rgba(42,40,36,0.04), 0 8px 32px rgba(42,40,36,0.08);
  page-break-after: always;
  display: flex; flex-direction: column;
}
@media print {
  body { background: #fff; }
  .page { margin: 0; box-shadow: none; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  @page { size: A4 portrait; margin: 0; }
}

/* ─── nav-chip cluster ─── */
.nav-cluster {
  position: absolute; bottom: 8mm; right: 8mm;
  display: flex; gap: 2mm; z-index: 10;
}
.nav-chip {
  font-family: var(--font-mono); font-size: 6pt;
  letter-spacing: 0.06em; color: var(--ink);
  text-decoration: none; opacity: 0.4;
  padding: 1.4mm 2.6mm;
  border: 0.4px solid var(--ink-whisper);
  border-radius: 1mm;
  background: rgba(249,245,236,0.7);
  transition: opacity 0.15s ease;
}
.nav-chip:hover { opacity: 0.85; }
.nav-chip.crisis { color: var(--clay-ink); border-color: var(--clay-edge); }

/* ─── header ─── */
.header { margin-bottom: 9mm; flex-shrink: 0; }
.kicker {
  font-family: var(--font-mono); font-size: 7.5pt; font-weight: 500;
  text-transform: uppercase; letter-spacing: 0.18em;
  color: var(--ink-quiet);
  opacity: 0.55;
  margin-bottom: 4mm;
}
h1 {
  font-family: var(--font-serif); font-style: italic;
  font-size: 22pt; font-weight: 400;
  line-height: 1.05; letter-spacing: -0.01em;
  color: var(--ink);
  font-variation-settings: "opsz" 144, "SOFT" 100;
}

/* ─── inventory table ─── */
.inv-table {
  display: table;
  width: 100%;
  border-collapse: collapse;
  margin-bottom: 8mm;
}
.inv-row {
  display: table-row;
}
.inv-row .inv-cat,
.inv-row .inv-status {
  display: table-cell;
  vertical-align: top;
  padding: 5mm 0;
  border-bottom: 0.5px solid var(--sage-rule);
}
.inv-row:first-child .inv-cat,
.inv-row:first-child .inv-status {
  border-top: 0.5px solid var(--sage-rule);
}
.inv-cat {
  width: 38%;
  padding-right: 6mm;
  font-family: var(--font-serif); font-style: italic;
  font-size: 12pt; font-weight: 400;
  color: var(--ink); line-height: 1.1;
  font-variation-settings: "opsz" 72, "SOFT" 100;
  letter-spacing: 0.005em;
}
.inv-status {
  width: 62%;
}
.status-row {
  display: flex; align-items: flex-start;
  gap: 3mm;
}
.checkbox {
  width: 4mm; height: 4mm;
  border: 0.6px solid var(--sage);
  border-radius: 0.6mm;
  flex-shrink: 0;
  margin-top: 1.5mm;
  background: rgba(255,255,255,0.3);
}
.lines {
  flex: 1;
  display: flex; flex-direction: column;
  gap: 4mm;
  padding-top: 0.8mm;
}
.line {
  height: 0;
  border-bottom: 0.5px dotted var(--ink-whisper);
}

/* ─── footer permission strip ─── */
.permission {
  position: absolute;
  left: var(--margin); right: var(--margin);
  bottom: 30mm;
  font-family: var(--font-serif); font-style: italic;
  font-size: 11pt; color: var(--sage-ink);
  text-align: center;
  font-variation-settings: "opsz" 14, "SOFT" 100;
  line-height: 1.3;
}
.bind-edge {
  position: absolute;
  left: 0;
  top: 0;
  height: 100%;
  width: 6mm;
  background: var(--bleed);
  pointer-events: none;
  z-index: 0;
}
</style>
</head>
<body>
<main class="page" role="document">
  <div class="bind-edge" aria-hidden="true"></div>
  <a id="page-06" name="page-06" class="anchor" style="display:block;height:0;visibility:hidden;"></a>

  {{HEADER_CONTENT}}
  <header class="header">
    <div class="kicker">§ shelf · behavioral activation</div>
    <h1>minimum viable today.</h1>
  </header>

  <section class="inv-table" aria-label="five domains, min-viable version today">

    <div class="inv-row">
      <span class="inv-cat">care</span>
      <span class="inv-status">
        <span class="status-row">
          <span class="checkbox" aria-hidden="true"></span>
          <span class="lines">
            <span class="line"></span>
            <span class="line"></span>
          </span>
        </span>
      </span>
    </div>

    <div class="inv-row">
      <span class="inv-cat">responsibility</span>
      <span class="inv-status">
        <span class="status-row">
          <span class="checkbox" aria-hidden="true"></span>
          <span class="lines">
            <span class="line"></span>
            <span class="line"></span>
          </span>
        </span>
      </span>
    </div>

    <div class="inv-row">
      <span class="inv-cat">connection</span>
      <span class="inv-status">
        <span class="status-row">
          <span class="checkbox" aria-hidden="true"></span>
          <span class="lines">
            <span class="line"></span>
            <span class="line"></span>
          </span>
        </span>
      </span>
    </div>

    <div class="inv-row">
      <span class="inv-cat">movement</span>
      <span class="inv-status">
        <span class="status-row">
          <span class="checkbox" aria-hidden="true"></span>
          <span class="lines">
            <span class="line"></span>
            <span class="line"></span>
          </span>
        </span>
      </span>
    </div>

    <div class="inv-row">
      <span class="inv-cat">pleasure</span>
      <span class="inv-status">
        <span class="status-row">
          <span class="checkbox" aria-hidden="true"></span>
          <span class="lines">
            <span class="line"></span>
            <span class="line"></span>
          </span>
        </span>
      </span>
    </div>

  </section>

  {{FOOTER_CONTENT}}
  <p class="permission">min-viable counts. one line per domain is enough.</p>

  <div class="nav-cluster">
    <a class="nav-chip" href="#page-22">[home]</a>
    <a class="nav-chip" href="#page-21">[stickers]</a>
    <a class="nav-chip crisis" href="#page-23">[crisis]</a>
  </div>
</main>
</body>
</html>
