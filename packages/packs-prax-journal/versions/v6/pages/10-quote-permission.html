<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Prax Journal v6 · 10 · Quote / Permission · CARD-PAGE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Instrument+Sans:wght@400;500&family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════════
   PRAX JOURNAL v6 · PAGE 10 · QUOTE / PERMISSION · CARD-PAGE ARCHETYPE
   Wave 13 rebuild. ONE content card centered vertically AND horizontally.
   Italic Fraunces 28pt quote, mono 7pt attribution, italic 12pt permission.
   NO header. NO kicker. NO permission strip.
   ═══════════════════════════════════════════════════════════════════════ */
:root {
  --page-w: 210mm; --page-h: 297mm; --margin: 22mm;
  --paper: #F2F0EC;
  --bleed: rgba(192, 136, 102, 0.22);
  --ink: #1f2126;
  --ink-quiet: #6E6658;
  --ink-whisper: #B5AD9F;
  --sage-ink: #4E6249;
  --font-serif: 'Fraunces', 'Iowan Old Style', 'Charter', 'Georgia', serif;
  --font-sans:  'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', sans-serif;
  --font-mono:  'JetBrains Mono', 'SF Mono', 'Menlo', 'Consolas', monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #E4DFD2; }
body {
  font-family: var(--font-serif);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}
.page {
  width: var(--page-w); height: var(--page-h);
  background: var(--paper);
  margin: 10mm auto; padding: var(--margin);
  position: relative; overflow: hidden;
  box-shadow: 0 1px 2px rgba(42,40,36,0.04), 0 8px 32px rgba(42,40,36,0.08);
  page-break-after: always;
  display: flex;
  align-items: center;
  justify-content: center;
}
@media print {
  body { background: #fff; }
  .page { margin: 0; box-shadow: none; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  @page { size: A4 portrait; margin: 0; }
}

/* ─── The card. Centered both axes. ─── */
.card {
  max-width: 130mm;
  text-align: center;
}

.quote {
  font-family: var(--font-serif);
  font-style: italic;
  font-weight: 400;
  font-size: 28pt;
  line-height: 1.15;
  color: var(--ink);
  letter-spacing: -0.005em;
  font-variation-settings: "opsz" 144;
}
.quote .line { display: block; }

.attribution {
  margin-top: 5mm;
  font-family: var(--font-mono);
  font-size: 7pt;
  font-weight: 400;
  letter-spacing: 0.18em;
  text-transform: lowercase;
  color: var(--ink);
  opacity: 0.55;
}

.permission-line {
  margin-top: 12mm;
  font-family: var(--font-serif);
  font-style: italic;
  font-size: 12pt;
  font-weight: 400;
  line-height: 1.4;
  color: var(--ink);
  opacity: 0.65;
  letter-spacing: 0.005em;
}

/* ─── Goodnotes nav-chip cluster, bottom-right corner ─── */
.nav-cluster {
  position: absolute;
  bottom: 10mm; right: var(--margin);
  display: flex; gap: 4mm;
  font-family: var(--font-mono);
  font-size: 6.5pt;
  font-weight: 500;
  letter-spacing: 0.16em;
  line-height: 1;
}
.nav-cluster a {
  color: var(--ink-quiet);
  text-decoration: none;
  opacity: 0.4;
  transition: opacity 0.15s ease;
}
.nav-cluster a:hover { opacity: 0.9; color: var(--sage-ink); }
.bind-edge {
  position: absolute;
  left: 0;
  top: 0;
  height: 100%;
  width: 6mm;
  background: var(--bleed);
  pointer-events: none;
  z-index: 0;
}
</style>
</head>
<body>
<main class="page" id="page-10" data-template="prax-journal-v6-quote-permission" role="document">
  <div class="bind-edge" aria-hidden="true"></div>
  <a id="page-10-anchor" class="anchor" aria-hidden="true"></a>

  <!-- The card IS the page -->
  <section class="card" aria-label="Quote">
    <p class="quote">
      <span class="line">You are the sky.</span>
      <span class="line">Everything else is just the weather.</span>
    </p>
    <p class="attribution">— pema chödrön</p>
    <p class="permission-line">no need to react. just see it.</p>
  </section>

  <!-- Goodnotes nav cluster, bottom-right -->
  <nav class="nav-cluster" aria-label="Journal navigation">
    <a href="#page-22">[home]</a>
    <a href="#page-04">[shelf]</a>
    <a href="#page-21">[stickers]</a>
    <a href="#page-23">[crisis]</a>
    <a href="#page-11">[next]</a>
  </nav>
</main>
</body>
</html>
