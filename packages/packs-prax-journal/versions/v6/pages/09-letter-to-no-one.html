<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Prax Journal v6 · 09 · Letter to No One · LETTER-PAGE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Instrument+Sans:wght@400;500&family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════════
   PRAX JOURNAL v6 · PAGE 09 · LETTER TO NO ONE · LETTER-PAGE ARCHETYPE
   Wave 13 rebuild. 28mm side margins, asymmetric "Dear ___,",
   22 letter-prose baselines (sage hairlines, line-height 8mm),
   tiny italic note bottom-right. NO kicker. NO permission strip.
   ═══════════════════════════════════════════════════════════════════════ */
:root {
  --page-w: 210mm; --page-h: 297mm;
  --margin-side: 28mm;
  --margin-top: 22mm;
  --margin-bot: 22mm;
  --paper: #F2F0EC;
  --bleed: rgba(192, 136, 102, 0.22);
  --ink: #1f2126;
  --ink-quiet: #6E6658;
  --ink-whisper: #B5AD9F;
  --sage: #7e9b85;
  --sage-ink: #4E6249;
  --sage-hair: rgba(126, 155, 133, 0.25);
  --font-serif: 'Fraunces', 'Iowan Old Style', 'Charter', 'Georgia', serif;
  --font-sans:  'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', sans-serif;
  --font-mono:  'JetBrains Mono', 'SF Mono', 'Menlo', 'Consolas', monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #E4DFD2; }
body {
  font-family: var(--font-serif);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}
.page {
  width: var(--page-w); height: var(--page-h);
  background: var(--paper);
  margin: 10mm auto;
  padding: var(--margin-top) var(--margin-side) var(--margin-bot);
  position: relative; overflow: hidden;
  box-shadow: 0 1px 2px rgba(42,40,36,0.04), 0 8px 32px rgba(42,40,36,0.08);
  page-break-after: always;
}
@media print {
  body { background: #fff; }
  .page { margin: 0; box-shadow: none; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  @page { size: A4 portrait; margin: 0; }
}

/* ─── Goodnotes nav-chip cluster, top-right corner (above date) ─── */
.nav-cluster {
  position: absolute;
  top: 10mm; right: var(--margin-side);
  display: flex; gap: 3.5mm;
  font-family: var(--font-mono);
  font-size: 6pt;
  font-weight: 500;
  letter-spacing: 0.16em;
  line-height: 1;
}
.nav-cluster a {
  color: var(--ink-quiet);
  text-decoration: none;
  opacity: 0.4;
  transition: opacity 0.15s ease;
}
.nav-cluster a:hover { opacity: 0.9; color: var(--sage-ink); }

/* ─── Date stamp, top-right (italic Fraunces 11pt, ghosted) ─── */
.date-stamp {
  position: absolute;
  top: 18mm; right: var(--margin-side);
  font-family: var(--font-serif);
  font-style: italic;
  font-size: 11pt;
  font-weight: 400;
  color: var(--ink);
  opacity: 0.5;
  text-align: right;
  letter-spacing: 0.04em;
  line-height: 1;
}

/* ─── "Dear ___," top-left of body (NOT a header bar) ─── */
.salutation {
  position: absolute;
  top: 36mm; left: var(--margin-side);
  font-family: var(--font-serif);
  font-style: italic;
  font-size: 14pt;
  font-weight: 400;
  color: var(--ink);
  opacity: 0.4;
  letter-spacing: 0.005em;
}
.salutation .blank {
  display: inline-block;
  min-width: 32mm;
  border-bottom: 0.4px solid var(--ink-whisper);
  margin: 0 1mm;
  height: 1em;
  vertical-align: -0.18em;
}

/* ─── Body: 22 lined baselines, line-height 8mm, sage hairlines ─── */
.letter-body {
  position: absolute;
  top: 50mm;
  left: var(--margin-side);
  right: var(--margin-side);
  /* 22 baselines × 8mm = 176mm */
  height: 176mm;
  background-image: repeating-linear-gradient(
    to bottom,
    transparent 0,
    transparent 7.7mm,
    var(--sage-hair) 7.7mm,
    var(--sage-hair) 8mm
  );
}

/* ─── Bottom-right tiny italic note ─── */
.no-reread {
  position: absolute;
  bottom: 14mm; right: var(--margin-side);
  font-family: var(--font-serif);
  font-style: italic;
  font-size: 9pt;
  font-weight: 400;
  color: var(--ink);
  opacity: 0.5;
  letter-spacing: 0.01em;
}
.bind-edge {
  position: absolute;
  left: 0;
  top: 0;
  height: 100%;
  width: 6mm;
  background: var(--bleed);
  pointer-events: none;
  z-index: 0;
}
</style>
</head>
<body>
<main class="page" id="page-09" data-template="prax-journal-v6-letter-to-no-one" role="document">
  <div class="bind-edge" aria-hidden="true"></div>
  <a id="page-09-anchor" class="anchor" aria-hidden="true"></a>

  <!-- Goodnotes nav cluster, top-right -->
  <nav class="nav-cluster" aria-label="Journal navigation">
    <a href="#page-22">[home]</a>
    <a href="#page-04">[shelf]</a>
    <a href="#page-21">[stickers]</a>
    <a href="#page-23">[crisis]</a>
    <a href="#page-10">[next]</a>
  </nav>

  <!-- Date stamp, ghosted, right-aligned -->
  <div class="date-stamp" aria-label="Date">__ · ___ · ____</div>

  <!-- "Dear ___," sits inside the body column, top-left -->
  <div class="salutation" aria-hidden="true">Dear<span class="blank"></span>,</div>

  <!-- 22 letter-prose baselines -->
  <section class="letter-body" aria-label="Letter writing space"></section>

  <!-- Tiny note, bottom-right -->
  <span class="no-reread">you don't have to read this again.</span>
</main>
</body>
</html>
