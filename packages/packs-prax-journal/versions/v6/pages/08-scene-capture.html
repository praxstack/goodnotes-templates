<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Prax Journal v6 · 08 · Scene Capture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400;1,9..144,500&family=Instrument+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════════
   PRAX JOURNAL v6 · PAGE 08 · SCENE CAPTURE  (SNAPSHOT-PAGE archetype)
   One bordered frame zone + a caption underneath. Less prose, more
   image-of-a-moment. Reads as scrapbook at thumbnail scale.
   ═══════════════════════════════════════════════════════════════════════ */
:root {
  --page-w: 210mm; --page-h: 297mm; --margin: 22mm;
  --paper: #F2F0EC;
  --bleed: rgba(192, 136, 102, 0.22);
  --ink: #1f2126;
  --ink-soft: #4A453D;
  --ink-quiet: #6E6658;
  --ink-whisper: #B5AD9F;
  --sage: #7e9b85;
  --sage-ink: #4E6249;
  --clay: #c08866;
  --amber: #d6a45e;
  --lavender: #a89bbf;
  --font-serif: 'Fraunces', 'Iowan Old Style', 'Charter', 'Georgia', serif;
  --font-sans:  'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', sans-serif;
  --font-mono:  'JetBrains Mono', 'SF Mono', 'Menlo', 'Consolas', monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #E4DFD2; }
body {
  font-family: var(--font-sans);
  font-size: 8.5pt;
  color: var(--ink-soft);
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
.page {
  width: var(--page-w);
  height: var(--page-h);
  background: var(--paper);
  margin: 10mm auto;
  padding: var(--margin);
  position: relative;
  overflow: hidden;
  box-shadow: 0 1px 2px rgba(42,40,36,0.04), 0 8px 32px rgba(42,40,36,0.08);
  page-break-after: always;
  display: flex;
  flex-direction: column;
}
@media print {
  html, body { background: #fff; }
  .page { margin: 0; box-shadow: none; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  @page { size: A4 portrait; margin: 0; }
}

/* ── Page anchor ── */
.anchor { display: block; height: 0; visibility: hidden; }

/* ── Header ── */
.header {
  display: flex;
  flex-direction: column;
  gap: 2.5mm;
  flex-shrink: 0;
  margin-bottom: 12mm;
}
.kicker {
  font-family: var(--font-mono);
  font-size: 7.5pt;
  font-weight: 500;
  text-transform: lowercase;
  letter-spacing: 0.10em;
  color: var(--ink);
  opacity: 0.55;
}
h1.title {
  font-family: var(--font-serif);
  font-size: 22pt;
  font-style: italic;
  font-weight: 400;
  line-height: 1.05;
  letter-spacing: -0.01em;
  color: var(--ink);
  font-variation-settings: "opsz" 144;
}

/* ── Snapshot frame (the page's center of gravity) ── */
.frame-zone {
  display: flex;
  flex-direction: column;
  align-items: center;
  flex-shrink: 0;
}
.snapshot-frame {
  position: relative;
  width: 150mm;
  height: 100mm;
  border: 0.6px solid rgba(126, 155, 133, 0.6);
  /* faint dotted hatch grid: 3mm × 3mm dots, sage opacity 0.08 */
  background-image: radial-gradient(
    circle,
    rgba(126, 155, 133, 0.08) 0.22mm,
    transparent 0.22mm
  );
  background-size: 3mm 3mm;
  background-position: 1.5mm 1.5mm;
}
.frame-tag {
  position: absolute;
  top: 4mm;
  left: 4mm;
  font-family: var(--font-mono);
  font-size: 6pt;
  font-weight: 400;
  letter-spacing: 0.10em;
  color: var(--ink);
  opacity: 0.5;
  line-height: 1;
}

/* ── Caption zone ── */
.caption-zone {
  width: 150mm;
  margin-top: 8mm;
  display: flex;
  flex-direction: column;
  gap: 4mm;
}
.caption-label {
  font-family: var(--font-serif);
  font-size: 14pt;
  font-style: italic;
  font-weight: 400;
  color: var(--ink);
  font-variation-settings: "opsz" 72;
  line-height: 1;
  letter-spacing: -0.005em;
}
.caption-lines {
  display: flex;
  flex-direction: column;
}
.caption-line {
  height: 7mm;
  border-bottom: 0.25px solid rgba(126, 155, 133, 0.55);
}

/* ── Footer permission strip ── */
.permission {
  position: absolute;
  bottom: 16mm;
  left: var(--margin);
  right: var(--margin);
  font-family: var(--font-serif);
  font-size: 11pt;
  font-style: italic;
  font-weight: 400;
  color: var(--ink-soft);
  text-align: center;
  font-variation-settings: "opsz" 14";
  letter-spacing: 0.005em;
  line-height: 1.3;
  opacity: 0.85;
}

/* ── Goodnotes nav-chip cluster bottom-right ── */
.nav-cluster {
  position: absolute;
  bottom: 8mm;
  right: 8mm;
  display: flex;
  gap: 1mm;
}
.nav-chip {
  font-family: var(--font-mono);
  font-size: 6pt;
  font-weight: 400;
  letter-spacing: 0.04em;
  color: var(--ink);
  text-decoration: none;
  opacity: 0.4;
  padding: 1.5mm 3mm;
  transition: opacity 0.15s ease;
}
.nav-chip:hover { opacity: 0.7; }
.bind-edge {
  position: absolute;
  left: 0;
  top: 0;
  height: 100%;
  width: 6mm;
  background: var(--bleed);
  pointer-events: none;
  z-index: 0;
}
</style>
</head>
<body>
<main class="page" data-template="prax-journal-v6-scene-capture" role="document">
  <div class="bind-edge" aria-hidden="true"></div>
  <a id="page-08" name="page-08" class="anchor"></a>

  <header class="header">
    <span class="kicker">§ shelf · scene capture</span>
    <h1 class="title">the moment, framed.</h1>
  </header>

  <section class="frame-zone" aria-label="Snapshot frame">
    <div class="snapshot-frame" role="img" aria-label="Empty frame for a stamp or sketch">
      <span class="frame-tag">frame ↗</span>
    </div>
    <div class="caption-zone" aria-label="Caption">
      <span class="caption-label">caption:</span>
      <div class="caption-lines">
        <div class="caption-line"></div>
        <div class="caption-line"></div>
        <div class="caption-line"></div>
        <div class="caption-line"></div>
      </div>
    </div>
  </section>

  <p class="permission">small frames count. one moment is enough.</p>

  <nav class="nav-cluster" aria-label="Page navigation">
    <a href="#page-22" class="nav-chip">[home]</a>
    <a href="#page-21" class="nav-chip">[stickers]</a>
    <a href="#page-23" class="nav-chip">[crisis]</a>
  </nav>
</main>
</body>
</html>
