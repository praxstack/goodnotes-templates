<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Prax Journal v6 · 11 · Loose Page · OPEN-PAPER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Instrument+Sans:wght@400;500&family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════════
   PRAX JOURNAL v6 · PAGE 11 · LOOSE PAGE · OPEN-PAPER ARCHETYPE
   Wave 16: kawaii + half/half. Top half = soft sage dotted grid,
   bottom half = plain blank paper. One small calm corner doodle.
   One micro-mark ("loose page"), Goodnotes nav-chips bottom-right.
   ═══════════════════════════════════════════════════════════════════════ */
:root {
  --page-w: 210mm; --page-h: 297mm; --margin: 22mm;
  --paper: #F6EFE2;
  --bleed: rgba(192, 136, 102, 0.22);
  --ink: #1f2126;
  --ink-quiet: #6E6658;
  --ink-whisper: #B5AD9F;
  --sage-ink: #4E6249;
  --font-serif: 'Fraunces', 'Iowan Old Style', 'Charter', 'Georgia', serif;
  --font-sans:  'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', sans-serif;
  --font-mono:  'JetBrains Mono', 'SF Mono', 'Menlo', 'Consolas', monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #E4DFD2; }
body {
  font-family: var(--font-mono);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}
.page {
  width: var(--page-w); height: var(--page-h);
  background: var(--paper);
  margin: 10mm auto; padding: var(--margin);
  position: relative; overflow: hidden;
  box-shadow: 0 1px 2px rgba(42,40,36,0.04), 0 8px 32px rgba(42,40,36,0.08);
  page-break-after: always;
}
@media print {
  body { background: #fff; }
  .page { margin: 0; box-shadow: none; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  @page { size: A4 portrait; margin: 0; }
}
.micro-mark {
  position: absolute; top: 12mm; right: 12mm;
  font-family: var(--font-mono); font-size: 6.5pt; font-weight: 400;
  letter-spacing: 0.14em; color: var(--ink); opacity: 0.4; line-height: 1; z-index: 2;
}
.nav-cluster {
  position: absolute; bottom: 10mm; right: var(--margin);
  display: flex; gap: 4mm; font-family: var(--font-mono);
  font-size: 6.5pt; font-weight: 500; letter-spacing: 0.16em; line-height: 1; z-index: 2;
}
.nav-cluster a { color: var(--ink-quiet); text-decoration: none; opacity: 0.4; transition: opacity 0.15s ease; }
.nav-cluster a:hover { opacity: 0.9; color: var(--sage-ink); }
.bind-edge {
  position: absolute; left: 0; top: 0; height: 100%; width: 6mm;
  background: var(--bleed); pointer-events: none; z-index: 0;
}

/* ─── top half: soft sage dotted grid ─── */
.dot-field {
  position: absolute;
  left: var(--margin); right: var(--margin);
  top: var(--margin); height: 124mm;
  background-image: radial-gradient(circle, rgba(126,155,133,0.25) 0.6mm, transparent 0.6mm);
  background-size: 5mm 5mm;
  z-index: 1; pointer-events: none;
}
/* bottom half stays plain paper — nothing drawn. */

/* ─── small kawaii corner doodle: a calm sage sprig ─── */
.doodle {
  position: absolute; bottom: 24mm; left: 24mm;
  width: 22mm; height: auto; opacity: 0.6; z-index: 1; pointer-events: none;
}
</style>
</head>
<body>
<main class="page" id="page-11" data-template="prax-journal-v6-loose-page" role="document">
  <div class="bind-edge" aria-hidden="true"></div>
  <a id="page-11-anchor" class="anchor" aria-hidden="true"></a>

  <span class="micro-mark">loose page</span>

  <!-- top half: dotted grid; bottom half: plain blank -->
  <div class="dot-field" aria-hidden="true"></div>

  <!-- a tiny calm sage sprig in the lower-left corner -->
  <svg class="doodle" viewBox="0 0 60 60" role="img" aria-label="small sage sprig">
    <g fill="none" stroke="#7E9B85" stroke-width="2" stroke-linecap="round">
      <path d="M30 56 C30 40 30 26 30 14"/>
      <path d="M30 40 C22 36 17 30 16 22"/>
      <path d="M30 40 C38 36 43 30 44 22"/>
      <path d="M30 28 C24 25 20 20 19 14"/>
      <path d="M30 28 C36 25 40 20 41 14"/>
    </g>
    <g fill="#7E9B85" opacity="0.85">
      <ellipse cx="14" cy="20" rx="4.5" ry="2.6" transform="rotate(-30 14 20)"/>
      <ellipse cx="46" cy="20" rx="4.5" ry="2.6" transform="rotate(30 46 20)"/>
      <ellipse cx="30" cy="11" rx="3.4" ry="5" fill="#6f8a76"/>
    </g>
  </svg>

  <nav class="nav-cluster" aria-label="Journal navigation">
    <a href="#page-22">[home]</a>
    <a href="#page-04">[shelf]</a>
    <a href="#page-21">[stickers]</a>
    <a href="#page-23">[crisis]</a>
    <a href="#page-12">[next]</a>
  </nav>
</main>
</body>
</html>
